name: Build VideoStar Tweak

on: [push, pull_request]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          echo "THEOS=~/theos" >> $GITHUB_ENV

      - name: Setup iOS SDK
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/theos/sdks.git ~/theos/sdks
          cd ~/theos/sdks && git sparse-checkout set --no-cone iPhoneOS14.5.sdk && git checkout
          
      - name: Build Tweak
        run: |
          make package FINALPACKAGE=1

      - name: Upload Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: VideoStarTool-Package
          path: packages/*.deb
